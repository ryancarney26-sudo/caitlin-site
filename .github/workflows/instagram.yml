# The robot: every evening, Caitlin's new Instagram photo posts go onto the site. Her own caption
# line wins; otherwise Claude writes the caption, and keeps off anything that isn't a finished
# tattoo. See README.md, "New photos from Instagram".
name: Instagram photos

on:
  schedule:
    - cron: "23 19 * * *"   # every evening at 19:23 UTC (7:23pm in winter, 8:23pm in summer)
    - cron: "23 21 * * *"   # backup tries: GitHub sometimes skips scheduled runs. A backup that
    - cron: "23 23 * * *"   # finds nothing new changes nothing and sends nothing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would change. Change nothing."
        type: boolean
        default: false
      check_claude:
        description: "Only ask Claude about three photos already on the site. Change nothing."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r _src/instagram/requirements.txt

      - name: Check Claude
        if: inputs.check_claude == true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python -I _src/instagram/describe.py --check
          images/tattoo-preston-medusa.jpg
          images/character-portrait-tattoo-preston-01.jpg
          images/share-home.jpg

      - name: Look at Instagram
        id: sync
        if: inputs.check_claude != true
        env:
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -I _src/instagram/sync.py ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Build the site
        if: steps.sync.outputs.rebuild == 'true'
        run: python -I _src/make.py --final

      - name: Commit and push
        # Also after a failed run that recorded a connection warning, so the backups stay quiet.
        if: ${{ !cancelled() && steps.sync.outputs.changed == 'true' }}
        env:
          MESSAGE: ${{ steps.sync.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$MESSAGE"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          echo "Could not push after three attempts"
          exit 1
