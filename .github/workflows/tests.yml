name: Tests

on:
  push:
    branches: ["**"]      # every branch, so a change is tested on the runner's Python before it lands
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r _src/instagram/requirements.txt pytest

      - name: Test
        run: python -m pytest _src/instagram/tests -q
