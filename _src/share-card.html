<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Share cards: rendered at 1200 by 630 into images/share-*.jpg</title>
  <!-- Not part of the site. Open at 1200x630 and screenshot each variant; render_cards in
       the session notes does it with Playwright. The variants are set from script: the title,
       the line under it, the photo in the arch, and whether the brand line shows. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;900&family=Grenze:ital,wght@0,500;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
    body { background: var(--night); }
    .card { position: absolute; inset: 0; z-index: 2; }
    .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; z-index: 3; }
    .copy .brand { font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--violet); margin: 0 0 6px; line-height: 1; }
    .card h1 { font-family: var(--display); font-weight: 900; font-size: 112px; line-height: 0.92; margin: 0; color: var(--bone); text-shadow: 0 12px 40px rgba(0,0,0,0.6); letter-spacing: -0.01em; }
    .card.subject h1 { font-size: 82px; line-height: 0.98; }
    .card .stencil-line { width: 440px; height: 18px; margin: 24px 0 20px; }
    .card .stencil-line path { stroke-dasharray: none; animation: none; }
    .card.subject .stencil-line path { stroke-dasharray: 14 9; }
    .sub { font-family: var(--body); font-size: 29px; line-height: 1.3; color: var(--muted); margin: 0; max-width: 560px; }
    .arch.big { position: absolute; right: 96px; top: 48px; width: 330px; z-index: 1; }
    .arch.small { position: absolute; right: 372px; bottom: 36px; width: 196px; z-index: 2; }
    .card.subject .arch.big { right: 110px; top: 40px; width: 366px; }
    .card.subject .arch.small { display: none; }
    .card.subject .copy { width: 600px; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="arch" clipPathUnits="objectBoundingBox"><path d="M0,1 L0,0.34 C0,0.15 0.27,0.035 0.5,0 C0.73,0.035 1,0.15 1,0.34 L1,1 Z"/></clipPath></defs></svg>
  <div class="wall" aria-hidden="true"></div>
  <div class="lamp" aria-hidden="true" style="transform: translate(360px, -290px)"></div>
  <div class="card" id="card">
    <div class="copy">
      <p class="brand" id="brand" hidden>Caitlin Carney Tattoo</p>
      <h1 id="title">Caitlin Carney Tattoo</h1>
      <svg class="stencil-line" viewBox="0 0 600 18" aria-hidden="true" preserveAspectRatio="none"><path d="M2 9 C 80 4, 140 14, 220 9 S 360 3, 440 10 S 560 14, 598 8"/></svg>
      <p class="sub" id="sub">Tattoo artist at True Colours, Preston. Portraits, Christian pieces and script, in black and grey or colour.</p>
    </div>
    <figure class="arch big"><img id="big" src="../caitlin-site-v2/images/christian-tattoo-preston-01.jpg" alt="" width="800" height="1200"><div class="recess"></div><svg class="line" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true"><path class="outer" d="M0,150 L0,51 C0,22.5 27,5.25 50,0 C73,5.25 100,22.5 100,51 L100,150 Z"/><path class="inner" d="M3,147 L3,52 C3,26 28,9 50,4 C72,9 97,26 97,52 L97,147 Z"/><path class="light" d="M0,150 L0,51 C0,22.5 27,5.25 50,0"/></svg></figure>
    <figure class="arch small"><img id="small" src="../caitlin-site-v2/images/character-portrait-tattoo-preston-02.jpg" alt="" width="800" height="1200"><div class="recess"></div><svg class="line" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true"><path class="outer" d="M0,150 L0,51 C0,22.5 27,5.25 50,0 C73,5.25 100,22.5 100,51 L100,150 Z"/><path class="inner" d="M3,147 L3,52 C3,26 28,9 50,4 C72,9 97,26 97,52 L97,147 Z"/><path class="light" d="M0,150 L0,51 C0,22.5 27,5.25 50,0"/></svg></figure>
  </div>
</body>
</html>
