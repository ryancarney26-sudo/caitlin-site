<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <meta name="theme-color" content="#0c0a0f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0a0f'/%3E%3Cpath d='M8 28 V13 C8 7 13 4 16 3 C19 4 24 7 24 13 V28' fill='none' stroke='%239a7fd1' stroke-width='2.5'/%3E%3C/svg%3E">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:locale" content="en_GB">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{og_alt}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{og_image}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;900&family=Grenze:ital,wght@0,500;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  <script type="application/ld+json">
{{ldjson}}
  </script>
</head>
<body class="{{body_class}}">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="arch" clipPathUnits="objectBoundingBox">
        <path d="M0,1 L0,0.34 C0,0.15 0.27,0.035 0.5,0 C0.73,0.035 1,0.15 1,0.34 L1,1 Z"/>
      </clipPath>
    </defs>
  </svg>
  <div class="wall" aria-hidden="true"></div>
  <div class="lamp" id="lamp" aria-hidden="true"></div>
  <a class="skip" href="#main">Skip to the content</a>
{{draft_banner}}
  <header class="bar" id="bar">
    <div class="left">{{bar_left}}</div>
    <nav aria-label="Pages">
      <a href="/#work"{{cur_work}}>Work</a>
      <a href="/prices/"{{cur_prices}}>Prices</a>
      <a href="/about/"{{cur_about}}>About</a>
      <a href="/#book">Booking</a>
    </nav>
  </header>

  <main id="main">
{{body}}
  </main>

{{strip}}
  <footer>
    Caitlin Carney Tattoo, True Colours Tattoo &amp; Piercing Studio, 14 Guildhall Street, Preston PR1 3NU.
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/prices/">Prices and booking</a></li>
      <li><a href="/lancashire/">Where my clients come from</a></li>
      <li><a href="/about/">About me</a></li>
      <li><a href="https://www.instagram.com/caitlincarneytattoo/">Instagram</a></li>
    </ul>
  </footer>

  <script>
  (function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    // Sections rise into view
    var items = document.querySelectorAll('.reveal');
    if (reduce || !('IntersectionObserver' in window)) {
      items.forEach(function (el) { el.classList.add('in'); });
    } else {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      items.forEach(function (el) { io.observe(el); });
    }

    // Dust: a few dozen slow specks wherever a .dust box sits
    document.querySelectorAll('.dust').forEach(function (box) {
      for (var i = 0; i < 36; i++) {
        var s = document.createElement('i');
        s.style.left = (Math.random() * 100) + '%';
        s.style.top = (40 + Math.random() * 60) + '%';
        s.style.setProperty('--t', (12 + Math.random() * 16) + 's');
        s.style.setProperty('--d', (-Math.random() * 20) + 's');
        s.style.setProperty('--x', ((Math.random() - 0.5) * 120) + 'px');
        s.style.setProperty('--o', (0.25 + Math.random() * 0.5).toFixed(2));
        var size = (1.5 + Math.random() * 2.5).toFixed(1);
        s.style.width = size + 'px'; s.style.height = size + 'px';
        box.appendChild(s);
      }
    });

    // A gallery tile opens full size: its caption, arrows, and the way to book
    var opens = Array.prototype.slice.call(document.querySelectorAll('.gallery a.open'));
    var dlg = document.createElement('dialog');
    if (opens.length && typeof dlg.showModal === 'function') {
      dlg.className = 'lightbox';
      dlg.innerHTML = '<figure><img alt=""><figcaption></figcaption></figure>' +
        '<div class="lb-bar"><a class="btn primary" href="/#book">Get a quote</a><span class="lb-count"></span></div>' +
        '<button class="lb-prev" type="button" aria-label="Previous photo">&#8249;</button>' +
        '<button class="lb-next" type="button" aria-label="Next photo">&#8250;</button>' +
        '<button class="lb-close" type="button" aria-label="Close">&#215;</button>';
      document.body.appendChild(dlg);
      var lbImg = dlg.querySelector('img'), lbCap = dlg.querySelector('figcaption'), lbCount = dlg.querySelector('.lb-count'), cur = 0;
      var show = function (i) {
        cur = (i + opens.length) % opens.length;
        var src = opens[cur].querySelector('img');
        lbImg.src = opens[cur].getAttribute('href');
        lbImg.alt = src ? src.alt : '';
        lbCap.textContent = src ? src.alt : '';
        lbCount.textContent = (cur + 1) + ' of ' + opens.length;
      };
      opens.forEach(function (a, i) { a.addEventListener('click', function (e) { e.preventDefault(); show(i); dlg.showModal(); }); });
      dlg.querySelector('.lb-prev').addEventListener('click', function () { show(cur - 1); });
      dlg.querySelector('.lb-next').addEventListener('click', function () { show(cur + 1); });
      dlg.querySelector('.lb-close').addEventListener('click', function () { dlg.close(); });
      dlg.addEventListener('click', function (e) { if (e.target === dlg) { dlg.close(); } });
      dlg.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') { show(cur - 1); } if (e.key === 'ArrowRight') { show(cur + 1); } });
      var tx = 0;
      dlg.addEventListener('touchstart', function (e) { tx = e.changedTouches[0].clientX; }, { passive: true });
      dlg.addEventListener('touchend', function (e) { var dx = e.changedTouches[0].clientX - tx; if (dx > 50) { show(cur - 1); } else if (dx < -50) { show(cur + 1); } }, { passive: true });
      dlg.addEventListener('close', function () { lbImg.removeAttribute('src'); opens[cur].focus(); });
    }

    // Header turns glassy once scrolled; layers with a depth move at their own speed
    var bar = document.getElementById('bar');
    var layers = Array.prototype.slice.call(document.querySelectorAll('[data-depth]'));
    var ticking = false;
    function frame() {
      ticking = false;
      var y = window.scrollY || 0;
      if (bar) { bar.classList.toggle('stuck', y > 40); }
      if (reduce) { return; }
      var vh = window.innerHeight;
      layers.forEach(function (el) {
        var r = el.getBoundingClientRect();
        var centre = r.top + r.height / 2 - vh / 2;
        var d = parseFloat(el.getAttribute('data-depth')) || 0;
        el.style.transform = 'translate3d(0,' + (-centre * d).toFixed(1) + 'px,0)';
      });
    }
    window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }, { passive: true });
    window.addEventListener('resize', frame);
    frame();

    // The lamp follows the pointer; frames tilt under it
    var lamp = document.getElementById('lamp');
    if (fine && !reduce) {
      // On the home page the lamp sweeps in from the left once, then follows the pointer
      var sweeping = false;
      if (document.body.classList.contains('home')) {
        sweeping = true;
        lamp.style.transition = 'none';
        lamp.style.transform = 'translate(' + (-window.innerWidth * 0.9) + 'px,' + (window.innerHeight * 0.15) + 'px)';
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          lamp.style.transition = 'transform 2.8s cubic-bezier(0.22, 0.61, 0.36, 1)';
          lamp.style.transform = 'translate(' + (window.innerWidth * 0.3) + 'px,' + (-window.innerHeight * 0.2) + 'px)';
          setTimeout(function () { sweeping = false; lamp.style.transition = ''; }, 2900);
        }); });
      }
      document.addEventListener('mousemove', function (e) {
        if (sweeping) { return; }
        lamp.style.transform = 'translate(' + (e.clientX - window.innerWidth * 0.45) + 'px,' + (e.clientY - window.innerHeight * 0.45) + 'px)';
      });
      document.querySelectorAll('.tilt').forEach(function (el) {
        el.addEventListener('mousemove', function (e) {
          var r = el.getBoundingClientRect();
          var px = (e.clientX - r.left) / r.width - 0.5;
          var py = (e.clientY - r.top) / r.height - 0.5;
          el.style.setProperty('--ry', (px * 10).toFixed(2) + 'deg');
          el.style.setProperty('--rx', (-py * 8).toFixed(2) + 'deg');
        });
        el.addEventListener('mouseleave', function () { el.style.setProperty('--ry', '0deg'); el.style.setProperty('--rx', '0deg'); });
      });
    } else if (lamp) {
      lamp.style.transform = 'translate(' + (window.innerWidth * 0.3) + 'px,' + (window.innerHeight * 0.1) + 'px)';
    }
  })();
  </script>
</body>
</html>
